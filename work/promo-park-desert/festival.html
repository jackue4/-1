/* Celestial canvas sits behind the planet; warm lamps remain the foreground accents. */
#scene{z-index:1}
#app:after{background:radial-gradient(ellipse at 48% 65%,#47739c55,transparent 65%),linear-gradient(#10243f,#203e61 62%,#647c96)}

/* Cream lettering stays legible on the lavender dusk sky; panel controls keep their ink. */
html[data-phase=dusk] #app :is(.park-heading h1,.park-heading p,.park-heading div>span,.park-bottom>span){color:#fff3df;text-shadow:0 1px 8px #39335066}

html,body,#app{width:1080px!important;height:1920px!important;margin:0;overflow:hidden}.park-tools,.desert-tools,#loading,#show-card,#park-toast{display:none!important}#film{position:fixed;inset:0;z-index:100;width:1080px;height:1920px;pointer-events:none}</style></head><body>

 <nav class="park-light park-tools" aria-label="游乐园光照"><button data-phase="day" aria-pressed="true">☀ 晴昼</button><button data-phase="dusk" aria-pressed="false">◒ 落日</button><button data-phase="night" aria-pressed="false">☾ 星夜</button></nav>

 <div class="show-card" id="show-card" hidden><small>THE WISHES AFTER DARK</small><strong id="show-chapter">序曲 · 第一颗星</strong><div class="show-progress"><i id="show-progress"></i></div><span>让愿望，在这里开成花。</span></div>
