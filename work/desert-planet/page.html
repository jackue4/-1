<!doctype html><html lang="zh-CN" data-phase="day"><head><meta charset="utf-8"><title>沙海拾光</title></head><body>
<main id="app">
 <div id="scene" role="img" aria-label="沙海拾光三维星球，拖动环游，双指缩放"></div>
 <header class="desert-heading desert-tools"><span class="desert-mark" aria-hidden="true">◈</span><div><p>WHERE THE DUNES MEET THE SEA</p><h1>沙海拾光</h1><span>把时光，留在沙与海之间。</span></div></header>
 <nav class="desert-light desert-tools" aria-label="沙海光照"><button type="button" data-phase="day" aria-pressed="true">☀ 晴昼</button><button type="button" data-phase="dusk" aria-pressed="false">◒ 落日</button><button type="button" data-phase="night" aria-pressed="false">☾ 星夜</button></nav>
 <aside class="desert-postcard desert-tools"><span aria-hidden="true">⌁</span><p id="desert-poem">风有风的方向，你有你的慢时光。</p><small>A POSTCARD FROM THE QUIET SHORE</small></aside>
 <nav class="desert-views desert-tools" aria-label="沙海观景机位"><button type="button" data-view="globe" aria-pressed="true">◎ 整颗星球</button><button type="button" data-view="cove" aria-pressed="false">△ 悬崖海湾</button><button type="button" data-view="camel" aria-pressed="false">♧ 驼铃漫游</button><button type="button" data-view="moon" aria-pressed="false">☾ 月光奇遇</button><button type="button" data-view="treasury" aria-pressed="false">♜ 玫瑰石城</button><button type="button" data-view="oasis" aria-pressed="false">♧ 棕影绿洲</button><button type="button" data-view="kasbah" aria-pressed="false">⌂ 沙色小巷</button><button type="button" data-view="arch" aria-pressed="false">⌁ 风蚀石拱</button><button type="button" data-view="caravan" aria-pressed="false">♧ 驼铃驿站</button></nav>
 <div class="desert-bottom desert-tools"><span id="desert-caption">拖动环游 · 滚轮 / 双指靠近 · 让风替你翻一页沙与海</span><button type="button" id="desert-pause" aria-pressed="false" aria-label="暂停沙海拾光">Ⅱ</button><button type="button" id="desert-quality" aria-pressed="false">画质 · 细腻</button></div>
 <div id="loading" role="status">正在等沙与海醒来…</div>
</main>
</body></html>
