 :host([data-experience=scenic]) .brand{font-size:22px}\r

 :host([data-experience=scenic]) #help-button{margin-left:auto}\r
 :host([data-experience=scenic]) .view-switch{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));transform:none;width:auto;max-width:none;gap:2px;justify-content:space-between;padding:5px;border-radius:23px}\r
 :host([data-experience=scenic]) .view-switch button{flex:1;min-width:0;padding:8px 3px;font-size:12px;min-height:48px}\r
 :host([data-experience=scenic]) .time-presets{top:74px}\r
 :host([data-experience=scenic]) .paper{opacity:.06}\r
}\r
@media(max-height:540px) and (orientation:landscape){\r
 :host([data-experience=scenic]) .header{height:52px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\r
 :host([data-experience=scenic]) .brand{font-size:20px;gap:6px}\r
 :host([data-experience=scenic]) .brand-mark{font-size:26px}\r
 :host([data-experience=scenic]) #help-button{margin-left:auto}\r
 :host([data-experience=scenic]) .brand-sub,:host([data-experience=scenic]) .live,:host([data-experience=scenic]) .planet-caption{display:none}\r
 :host([data-experience=scenic]) .time-presets{top:2px;max-width:calc(100% - 144px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}\r
 :host([data-experience=scenic]) .time-presets button{min-width:54px;padding:7px 8px}\r
 :host([data-experience=scenic]) .view-switch{bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:3px}\r
 :host([data-experience=scenic]) .view-switch button{min-height:44px}\r
}\r
\r
/* Shared paper wash in meadow and globe; distance does not select a different art style. */\r
:host([data-experience=scenic]) .paper{opacity:.03}\r
\r
/* The shared planet bar already reserves the top safe area outside this world. */\r
:host([data-experience=scenic]) #loading{inset:64px 0 80px}\r
@media(max-width:650px) and (max-height:540px) and (orientation:landscape){
 :host([data-experience=scenic]) .brand>span:not(.brand-mark){display:none}
}

@media(max-height:600px) and (orientation:landscape){
 :host([data-tools=false]) :is(.header,.time-presets,.view-switch,.planet-caption,.toast){display:none!important}
 :host([data-tools=true]) .header{top:calc(62px + var(--world-safe-top,0px));height:48px}
 :host([data-tools=true]) .header .brand,:host([data-tools=true]) .header .live{display:none}
 :host([data-tools=true]) .time-presets{top:calc(62px + var(--world-safe-top,0px));left:max(12px,env(safe-area-inset-left,0px));transform:none;max-width:calc(100% - 100px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
}
:host([data-immersive=true][data-tools=false]) :is(.header,.time-presets,.view-switch,.planet-caption,.toast,.diary){display:none!important}
@media(orientation:portrait){
 :host([data-immersive=true][data-tools=true]) .header{top:calc(62px + var(--world-safe-top,0px))}
 :host([data-immersive=true][data-tools=true]) .time-presets{top:calc(132px + var(--world-safe-top,0px))}
}
