/* Cool moonlit blue keeps ivory snow distinct from the warm riverside lanterns. */
#scene{z-index:1}
#app:after{background:radial-gradient(ellipse at 42% 65%,#628ca94d,transparent 62%),linear-gradient(145deg,#122941,#2d4a69 68%,#6e8ca0)}

/* Only unframed dusk copy is lightened; all cream-panel text stays dark. */
