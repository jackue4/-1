<!doctype html><html lang="zh-CN" data-phase="day"><head><meta charset="utf-8"><title>江南听雪</title></head><body>
<main id="app">
 <div id="scene" role="img" aria-label="江南听雪三维星球，拖动环游，双指缩放"></div>
 <header class="snow-heading snow-tools"><span class="snow-seal">江<br>南</span><div><p>LET THE SNOW WHISPER</p><h1>江南听雪</h1><span>一半烟火，一半诗。</span></div></header>
 <nav class="snow-light snow-tools" aria-label="雪景时刻"><button data-phase="day" aria-pressed="true">雪后初晴</button><button data-phase="dusk" aria-pressed="false">暮色归舟</button><button data-phase="night" aria-pressed="false">灯火听雪</button></nav>
 <aside class="snow-letter snow-tools"><small>寄一封冬日来信</small><p id="snow-poem">雪落无声，江南有梦。</p><span id="snow-subtitle">白墙黛瓦 · 小桥流水 · 疏影横斜</span></aside>

 <nav id="snow-friends" class="snow-friends snow-tools" aria-label="选择撑伞的小伙伴" hidden><span>陪谁看雪</span><button data-friend="rabbit" aria-pressed="true">棉棉 · 小兔</button><button data-friend="bear" aria-pressed="false">麦麦 · 小熊</button></nav>
 <footer class="snow-bottom snow-tools"><span id="snow-caption">拖动环游 · 滚轮 / 双指靠近 · 慢慢看一场江南雪</span><button id="snowfall-toggle" aria-pressed="false">雪 · 轻柔</button><button id="snow-pause" aria-label="暂停江南听雪" aria-pressed="false">Ⅱ</button><button id="snow-quality" aria-pressed="false">画质 · 细腻</button></footer>
